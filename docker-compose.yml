networks:
  dast-net:
    driver: bridge

services:

  gui:
    image: dast-gui
    container_name: dast-gui
    environment:
      - KIBANA_URL_EXTERNAL=http://192.168.159.155:5601
      - KIBANA_URL=http://kibana:5601 
    ports:
      - "8888:8888"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/dast-platform/output:/app/output
      - ./config.json:/app/config/config.json
      - .:/app/project
      - ./gui/app.py:/app/app.py:ro
      - ./gui/templates:/app/templates

    networks: [dast-net]
    restart: unless-stopped

  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa
    environment:
      - DB_SERVER=dvwa-db
      - DB_PORT=3306
      - DB_USER=dvwa
      - DB_PASSWORD=p@ssw0rd
      - DB_DATABASE=dvwa
    networks: [dast-net]
    ports:
      - "${DVWA_PORT}:80"
    depends_on:
      - dvwa-db


  dvwa-db:
    image: mariadb:10.11
    container_name: dvwa-db
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=dvwa
      - MYSQL_USER=dvwa
      - MYSQL_PASSWORD=p@ssw0rd
    networks: [dast-net]
    volumes:
      - dvwa-db-data:/var/lib/mysql

  vulnsite:
    build: ./vulnsite
    image: dast-vulnsite
    container_name: vulnsite
    networks: [dast-net]
    ports:
      - "8082:80"
  
  juice-shop:
    image: bkimminich/juice-shop:latest
    container_name: juice-shop
    networks: [dast-net]
    ports:
      - "${JUICE_PORT}:3000"

  bwapp:
    image: raesene/bwapp:latest
    container_name: bwapp
    networks: [dast-net]
    ports:
      - "8081:80"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:${ES_VERSION}
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks: [dast-net]
    ports:
      - "${ES_PORT}:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 15s
      timeout: 5s
      retries: 10

  kibana:
    image: docker.elastic.co/kibana/kibana:${KIBANA_VERSION}
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks: [dast-net]
    ports:
      - "${KIBANA_PORT}:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy


  crawler:
    build: ./crawler
    image: dast-crawler
    container_name: dast-crawler

    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200

    volumes:
      - /opt/dast-platform/output:/app/output
      - /opt/dast-platform/config.json:/app/config.json



#  crawler:
#    build: ./crawler
#    command: scrapy crawl dvwa
#    environment:
#      TARGET_URL: "http://dvwa:80"
#      APP_NAME: "dvwa"
#      SCAN_ID: "${SCAN_ID:-manual}"
#      SKIP_CRAWL: "false"
#      LOGIN_URL: "http://dvwa:80/login.php"
#      LOGIN_USER: "admin"
#      LOGIN_PASS: "password"
#      LOGIN_EXTRA: '{"Login": "Login"}'
#      CACHE_TTL_HOURS: "24"
#      MAX_PAGES: "200"
#    volumes:
#      - /opt/dast-platform/output:/app/output


    networks: [dast-net]
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: "no"

  active-scanner:
    image: dast-active
    container_name: dast-active
    environment:

      - ES_HOST=elasticsearch
      - ES_PORT=9200
    volumes:
      - /opt/dast-platform/output:/app/input:ro
      - /opt/dast-platform/output:/app/output
      - /opt/dast-platform/config.json:/app/config.json
    networks: [dast-net]
    depends_on: [crawler]
    restart: "no"

  passive-scanner:
    image: dast-passive
    container_name: dast-passive
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    volumes:
      - /opt/dast-platform/output:/app/input:ro
      - /opt/dast-platform/output:/app/output
      - /opt/dast-platform/config.json:/app/config.json
    networks: [dast-net]
    depends_on: [crawler]
    restart: "no"

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    networks: [dast-net]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  ai-proxy:
    build: ./ai-proxy
    image: dast-ai-proxy
    container_name: dast-ai-proxy
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}     # from .env, gitignored
      - GROQ_MODEL=${GROQ_MODEL}
    networks: [dast-net]
    restart: unless-stopped
    # NOTE: no "ports:" — internal only, never reachable from host/internet


  ai-module:
    image: dast-ai
    container_name: dast-ai
    environment:
      - ES_HOST=http://elasticsearch:9200
      - ES_PORT=9200
      - LLM_BASE_URL=http://192.168.1.12:1234/v1
      - MODEL=qwen2.5-3b-instruct
      - WORKERS=1
    volumes:
      - /opt/dast-platform/config.json:/app/config.json
      - /opt/dast-platform/ai-module:/app
      - /opt/dast-platform/output:/app/input:ro
      - /opt/dast-platform/output:/app/output

    networks: [dast-net]
    restart: "no"



  reporter:
    image: dast-reporter
    container_name: dast-reporter
    environment:
      - ES_HOST=elasticsearch
      - ES_PORT=9200
    volumes:
      - /opt/dast-platform/output:/app/output
      - /opt/dast-platform/config.json:/app/config.json
    networks: [dast-net]
    restart: "no"

volumes:
  es-data:
  dvwa-db-data:
  ollama-data:
