server_tokens off;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name dast.internal;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name dast.internal;

    ssl_certificate     /etc/nginx/certs/dast.internal.crt;
    ssl_certificate_key /etc/nginx/certs/dast.internal.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location /kibana/ {
        set $kibana_up http://kibana:5601;
        proxy_pass $kibana_up;
    }

    location / {
        set $gui_up http://gui:8888;
        proxy_pass $gui_up;
        proxy_read_timeout 300s;
    }
}
